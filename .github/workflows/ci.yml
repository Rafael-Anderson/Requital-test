name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend (tsc, unit, e2e)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shop_manager
          MYSQL_USER: shop_app
          MYSQL_PASSWORD: shop_app_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Keep in sync with engines.node in backend/package.json.
          node-version: "22.x"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Dummy-value env file, committed — no repo secrets, no real network
      # calls. See backend/.env.ci's own header comment.
      - name: Set up CI env
        run: cp .env.ci .env

      - run: npx prisma generate

      # migrate deploy (not migrate dev) applies the hand-authored migrations
      # in prisma/migrations/ as-is against a clean database — no shadow DB
      # involved, matching CLAUDE.md's "never pass DATABASE_URL as
      # --shadow-database-url" rule (that flag isn't used here at all).
      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy

      - run: npx tsc --noEmit

      - run: npm test -- --ci

      - run: npm run test:e2e -- --ci --maxWorkers=2

      # Backend lint has pre-existing @typescript-eslint debt (see CLAUDE.md's
      # "Known pre-existing lint gap") — this only fails on a count increase
      # from the committed baseline (backend/lint-baseline.txt), never on
      # pre-existing debt. See tools/check-lint-baseline.js's own header.
      - name: Lint (baseline-pinned — fails only on new errors)
        run: node ../tools/check-lint-baseline.js backend

      - name: npm audit (visible, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  admin:
    name: admin (tsc, lint, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Keep in sync with engines.node in admin/package.json.
          node-version: "22.x"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      # admin lint has pre-existing react-hooks/set-state-in-effect debt (see
      # CLAUDE.md's admin section) — baseline-pinned the same way as backend,
      # see tools/check-lint-baseline.js's header for the full rationale.
      - name: Lint (baseline-pinned — fails only on new errors)
        run: node ../tools/check-lint-baseline.js admin

      - run: npm test -- --run

      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            admin/.next/cache
          key: ${{ runner.os }}-nextjs-admin-${{ hashFiles('admin/package-lock.json') }}-${{ hashFiles('admin/**/*.js', 'admin/**/*.jsx', 'admin/**/*.ts', 'admin/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-admin-${{ hashFiles('admin/package-lock.json') }}-

      - run: npm run build

      - name: npm audit (visible, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  storefront:
    name: storefront (tsc, lint, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Keep in sync with engines.node in storefront/package.json.
          node-version: "22.x"
          cache: npm
          cache-dependency-path: storefront/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      # storefront lint has the same class of pre-existing debt as admin
      # (react-hooks/set-state-in-effect, plus a handful of
      # react/no-unescaped-entities and exhaustive-deps findings) —
      # baseline-pinned identically. See tools/check-lint-baseline.js.
      - name: Lint (baseline-pinned — fails only on new errors)
        run: node ../tools/check-lint-baseline.js storefront

      - run: npm test -- --run

      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            storefront/.next/cache
          key: ${{ runner.os }}-nextjs-storefront-${{ hashFiles('storefront/package-lock.json') }}-${{ hashFiles('storefront/**/*.js', 'storefront/**/*.jsx', 'storefront/**/*.ts', 'storefront/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-storefront-${{ hashFiles('storefront/package-lock.json') }}-

      - run: npm run build

      - name: npm audit (visible, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  guardrails:
    # Job name is a pinned branch-protection required-status-check context
    # string (see branch protection rules on main) — do not rename this even
    # though it no longer lists every guardrail step; renaming it changes
    # the check context GitHub reports, which the branch protection rule
    # wouldn't recognize, leaving a PR stuck "pending" on a check name that
    # never reports anymore.
    name: guardrails (outlet-scoping, page-width, sendEmail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Only backend's node_modules are needed: check-outlet-scoping.js and
      # check-page-width.js are dependency-free fs/grep scripts (they scan
      # admin/storefront source as plain text, no install required there),
      # and the sendEmailStub guard is a backend Jest spec.
      - working-directory: backend
        run: npm ci

      - name: Outlet-scoping guardrail (tenant-isolation)
        run: node tools/check-outlet-scoping.js

      - name: Page-width guardrail
        run: node tools/check-page-width.js

      - name: No-console-log guardrail (structured logging)
        run: node tools/check-no-console-log.js

      - name: sendEmailStub bypass guardrail
        working-directory: backend
        run: npm test -- email-callsites --ci

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shop_manager
          MYSQL_USER: shop_app
          MYSQL_PASSWORD: shop_app_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin/package-lock.json
            storefront/package-lock.json
            e2e/package-lock.json

      # Backend, built (not `start:dev`'s ts-node watch mode — no reload
      # needed here, just a fast, stable boot) and started in the
      # background. Same dummy .env.ci every other backend CI step uses.
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: cp .env.ci .env
      - working-directory: backend
        run: npx prisma generate
      - working-directory: backend
        run: npx prisma migrate deploy
      - working-directory: backend
        run: npm run build
      - name: Start backend (background)
        working-directory: backend
        run: nohup node dist/main.js > /tmp/backend.log 2>&1 &
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/health; then echo "backend up after ${i}s"; exit 0; fi
            sleep 2
          done
          echo "backend never became ready"; cat /tmp/backend.log; exit 1

      # Admin and storefront, dev servers pinned to the ports the seed/specs
      # expect (see root CLAUDE.md's "Port note" — neither app pins a port
      # by default, so an explicit -p here avoids the auto-increment race
      # entirely rather than relying on start order).
      - working-directory: admin
        run: npm ci
      - name: Start admin (background)
        working-directory: admin
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_STOREFRONT_URL: http://localhost:3002
        run: nohup npx next dev -p 3001 > /tmp/admin.log 2>&1 &

      - working-directory: storefront
        run: npm ci
      - name: Start storefront (background)
        working-directory: storefront
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3002
        run: nohup npx next dev -p 3002 > /tmp/storefront.log 2>&1 &

      - name: Wait for admin + storefront
        run: |
          for i in $(seq 1 60); do
            a=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/login)
            s=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3002/)
            if [ "$a" = "200" ] && [ "$s" = "200" ]; then echo "admin+storefront up after ${i}s"; exit 0; fi
            sleep 2
          done
          echo "admin/storefront never became ready"; cat /tmp/admin.log; cat /tmp/storefront.log; exit 1

      - working-directory: e2e
        run: npm ci
      - name: Install Playwright chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
